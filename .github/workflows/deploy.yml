name: Build and deploy container to AWS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-container-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_CONFIG_JSON: ${{ secrets.DEPLOY_CONFIG_JSON }}
        run: |
          set -eu
          test -n "$DEPLOY_CONFIG_JSON" || { echo "Missing Actions secret DEPLOY_CONFIG_JSON"; exit 1; }
          DEPLOY_HOST="$(jq -er '.host | select(type == "string" and length > 0)' <<< "$DEPLOY_CONFIG_JSON")"
          DEPLOY_USER="$(jq -er '.user | select(type == "string" and length > 0)' <<< "$DEPLOY_CONFIG_JSON")"
          SSH_PRIVATE_KEY="$(jq -er '.private_key | select(type == "string" and length > 0)' <<< "$DEPLOY_CONFIG_JSON")"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Build container image
        run: docker build --tag beginner-projects:${GITHUB_SHA} .

      - name: Transfer image to AWS server
        env:
          DEPLOY_CONFIG_JSON: ${{ secrets.DEPLOY_CONFIG_JSON }}
        run: |
          set -eu
          DEPLOY_HOST="$(jq -er '.host | select(type == "string" and length > 0)' <<< "$DEPLOY_CONFIG_JSON")"
          DEPLOY_USER="$(jq -er '.user | select(type == "string" and length > 0)' <<< "$DEPLOY_CONFIG_JSON")"
          docker save "beginner-projects:${GITHUB_SHA}" | \
            ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'docker load'

      - name: Start container on AWS server
        env:
          DEPLOY_CONFIG_JSON: ${{ secrets.DEPLOY_CONFIG_JSON }}
        run: |
          set -eu
          DEPLOY_HOST="$(jq -er '.host | select(type == "string" and length > 0)' <<< "$DEPLOY_CONFIG_JSON")"
          DEPLOY_USER="$(jq -er '.user | select(type == "string" and length > 0)' <<< "$DEPLOY_CONFIG_JSON")"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker rm -f beginner-projects >/dev/null 2>&1 || true; docker run -d --restart unless-stopped --name beginner-projects -p 80:80 beginner-projects:${GITHUB_SHA}"
