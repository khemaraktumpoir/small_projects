name: Build and deploy container to EC2 via GHCR

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: aws-container-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_CONFIG_JSON: ${{ secrets.DEPLOY_CONFIG_JSON }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$DEPLOY_CONFIG_JSON" || { echo "Missing Actions secret DEPLOY_CONFIG_JSON"; exit 1; }
          test -n "$PRIVATE_KEY" || { echo "Missing Actions secret PRIVATE_KEY"; exit 1; }
          DEPLOY_HOST="$(jq -er '.host | select(type == "string" and length > 0)' <<< "$DEPLOY_CONFIG_JSON")"
          DEPLOY_USER="$(jq -er '.user | select(type == "string" and length > 0)' <<< "$DEPLOY_CONFIG_JSON")"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Install Docker on AWS server
        env:
          DEPLOY_CONFIG_JSON: ${{ secrets.DEPLOY_CONFIG_JSON }}
        run: |
          set -eu
          DEPLOY_HOST="$(jq -er '.host | select(type == "string" and length > 0)' <<< "$DEPLOY_CONFIG_JSON")"
          DEPLOY_USER="$(jq -er '.user | select(type == "string" and length > 0)' <<< "$DEPLOY_CONFIG_JSON")"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'set -eu; if ! command -v docker >/dev/null 2>&1; then sudo apt-get update; sudo apt-get install -y docker.io; fi; sudo systemctl enable --now docker; sudo usermod -aG docker "$USER"'

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/clock-app" >> "$GITHUB_OUTPUT"

      - name: Log in, build, and push image to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -eu
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          IMAGE="$IMAGE_NAME:${GITHUB_SHA}"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Start container on AWS server
        env:
          DEPLOY_CONFIG_JSON: ${{ secrets.DEPLOY_CONFIG_JSON }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -eu
          DEPLOY_HOST="$(jq -er '.host | select(type == "string" and length > 0)' <<< "$DEPLOY_CONFIG_JSON")"
          DEPLOY_USER="$(jq -er '.user | select(type == "string" and length > 0)' <<< "$DEPLOY_CONFIG_JSON")"
          IMAGE="$IMAGE_NAME:${GITHUB_SHA}"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker pull '$IMAGE' && (docker rm -f beginner-projects >/dev/null 2>&1 || true) && docker run -d --restart unless-stopped --name beginner-projects -p 80:80 '$IMAGE'"
